<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="infBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#101F42"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#infBg)"/>

  <!-- Subtle Blueprint Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.6"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- TOP HEADER -->
  <rect x="0" y="0" width="1920" height="100" fill="#0A1128" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    SIGEDOR: <tspan fill="#38BDF8">El Motor Digital de la Gestión Docente Universitaria</tspan>
  </text>

  <!-- ================= LEFT COLUMN ================= -->
  <!-- 1. Expediente Integral 360° -->
  <g transform="translate(60, 130)">
    <rect width="320" height="230" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Folder Icon -->
    <rect x="25" y="25" width="60" height="50" rx="8" fill="#0284C7"/>
    <path d="M 25 35 L 45 35 L 55 45 L 85 45 L 85 75 L 25 75 Z" fill="#38BDF8"/>
    <circle cx="75" cy="65" r="14" fill="#F59E0B"/>
    <text x="75" y="70" text-anchor="middle" font-family="system-ui" font-size="12" fill="#000" font-weight="900">🔒</text>
    
    <text x="25" y="110" font-family="system-ui" font-size="20" font-weight="800" fill="#FFFFFF">Expediente Integral 360°</text>
    <text x="25" y="140" font-family="system-ui" font-size="13" fill="#94A3B8" width="270">
      <tspan x="25" dy="0">Centralización atómica de datos</tspan>
      <tspan x="25" dy="20">personales, académicos, escalafón,</tspan>
      <tspan x="25" dy="20">carga horaria y permisos en una sola</tspan>
      <tspan x="25" dy="20">vista unificada.</tspan>
    </text>
  </g>

  <!-- 2. Central Hub Radar Circle -->
  <g transform="translate(290, 500)">
    <!-- Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="105" fill="#0F172A" stroke="#38BDF8" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="75" fill="url(#hubGrad)"/>
    
    <!-- Center folder / loupe icon -->
    <text x="0" y="8" text-anchor="middle" font-family="system-ui" font-size="34">🔍</text>
    
    <!-- Orbiting nodes -->
    <circle cx="-130" cy="0" r="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="-130" y="6" text-anchor="middle" font-size="14">📊</text>
    
    <circle cx="0" cy="-130" r="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="-124" text-anchor="middle" font-size="14">📜</text>
    
    <circle cx="130" cy="0" r="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="130" y="6" text-anchor="middle" font-size="14">👤</text>

    <circle cx="0" cy="130" r="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="136" text-anchor="middle" font-size="14">🔒</text>

    <!-- Curved Label -->
    <text x="0" y="180" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1">
      ARQUITECTURA Y TECNOLOGÍA
    </text>
  </g>

  <!-- 3. Reportes PDF con Sello Criptográfico -->
  <g transform="translate(60, 680)">
    <rect width="320" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="42" font-family="system-ui" font-size="17" font-weight="800" fill="#FFFFFF">Reportes PDF con Sello</text>
    <text x="25" y="66" font-family="system-ui" font-size="17" font-weight="800" fill="#38BDF8">Criptográfico</text>
    <text x="25" y="96" font-family="system-ui" font-size="12.5" fill="#94A3B8">
      <tspan x="25" dy="0">Generación automatizada de constancias y</tspan>
      <tspan x="25" dy="18">memorandos con códigos institucionales</tspan>
      <tspan x="25" dy="18">(UNERG-REP-YYYY-XXXX).</tspan>
    </text>
  </g>

  <!-- 4. Estructura en Tres Capas -->
  <g transform="translate(60, 850)">
    <rect width="440" height="190" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="32" font-family="system-ui" font-size="16" font-weight="800" fill="#FFFFFF">Estructura en Tres Capas</text>
    <text x="25" y="52" font-family="system-ui" font-size="12" fill="#64748B">Separación estricta entre Presentación, Lógica y Datos.</text>
    
    <!-- 3 Tier Blocks -->
    <rect x="25" y="65" width="390" height="30" rx="6" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="220" y="85" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#FFFFFF">Presentación (Filament / Blade)</text>
    
    <rect x="25" y="103" width="390" height="30" rx="6" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="220" y="123" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#FFFFFF">Lógica de Negocio (Laravel / Spatie)</text>
    
    <rect x="25" y="141" width="390" height="30" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="220" y="161" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#FFFFFF">Persistencia de Datos (MySQL / MariaDB)</text>
  </g>

  <!-- ================= CENTER COLUMN ================= -->
  <!-- Funcionalidades Principales -->
  <g transform="translate(540, 130)">
    <text x="0" y="25" font-family="system-ui" font-size="24" font-weight="900" fill="#FFFFFF">Funcionalidades Principales</text>
    <text x="0" y="50" font-family="system-ui" font-size="14" fill="#94A3B8">Optimización y digitalización del ciclo de vida académico</text>

    <!-- Card 1: Escalafón y Ascensos -->
    <g transform="translate(0, 70)">
      <rect width="470" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="24" fill="#065F46"/>
      <text x="45" y="52" text-anchor="middle" font-size="20">📈</text>
      <text x="85" y="42" font-family="system-ui" font-size="18" font-weight="800" fill="#FFFFFF">Control de Escalafón y Ascensos</text>
      <text x="85" y="65" font-family="system-ui" font-size="13" fill="#10B981" font-weight="700">De Instructor a Titular con Posgrado</text>
      <text x="25" y="105" font-family="system-ui" font-size="12.5" fill="#94A3B8">
        <tspan x="25" dy="0">Seguimiento cronológico automático desde Instructor hasta</tspan>
        <tspan x="25" dy="18">Titular, validando títulos de posgrado y reglas de negocio.</tspan>
      </text>
    </g>

    <!-- Card 2: Carga y Dedicación -->
    <g transform="translate(0, 240)">
      <rect width="470" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="24" fill="#1E3A8A"/>
      <text x="45" y="52" text-anchor="middle" font-size="20">⏱️</text>
      <text x="85" y="42" font-family="system-ui" font-size="18" font-weight="800" fill="#FFFFFF">Gestión de Carga y Dedicación</text>
      <text x="85" y="65" font-family="system-ui" font-size="13" fill="#38BDF8" font-weight="700">TCV, MT, TC y Exclusiva (EX)</text>
      <text x="25" y="105" font-family="system-ui" font-size="12.5" fill="#94A3B8">
        <tspan x="25" dy="0">Control preciso de modalidades de contratación (TCV, MT,</tspan>
        <tspan x="25" dy="18">TC, EX) y distribución territorial de cátedras por sedes.</tspan>
      </text>
    </g>

    <!-- Stack Tecnológico de Vanguardia -->
    <g transform="translate(0, 420)">
      <rect width="470" height="390" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="25" y="38" font-family="system-ui" font-size="20" font-weight="800" fill="#FFFFFF">Stack Tecnológico de Vanguardia</text>
      <text x="25" y="60" font-family="system-ui" font-size="12.5" fill="#94A3B8">Arquitectura robusta probada en producción</text>

      <g transform="translate(25, 80)">
        <text x="0" y="25" font-family="system-ui" font-size="14" fill="#FFFFFF"><tspan fill="#EF4444" font-weight="bold">⚡ Framework Core:</tspan> Laravel 11</text>
        <text x="0" y="60" font-family="system-ui" font-size="14" fill="#FFFFFF"><tspan fill="#F59E0B" font-weight="bold">💻 Panel Administrativo:</tspan> Filament v3</text>
        <text x="0" y="95" font-family="system-ui" font-size="14" fill="#FFFFFF"><tspan fill="#38BDF8" font-weight="bold">🛡️ Gestión de Permisos:</tspan> Spatie Laravel-Permission</text>
        <text x="0" y="130" font-family="system-ui" font-size="14" fill="#FFFFFF"><tspan fill="#10B981" font-weight="bold">📄 Motor de Reportes:</tspan> DomPDF (A4 con QR)</text>
        <text x="0" y="165" font-family="system-ui" font-size="14" fill="#FFFFFF"><tspan fill="#A855F7" font-weight="bold">🌐 Documentación API:</tspan> OpenAPI 3.0 / Swagger</text>
        <text x="0" y="200" font-family="system-ui" font-size="14" fill="#FFFFFF"><tspan fill="#EC4899" font-weight="bold">🧪 Pruebas Automatizadas:</tspan> Pest / PHPUnit (49/49)</text>
      </g>

      <rect x="25" y="310" width="420" height="55" rx="8" fill="#0A1128" stroke="#1E293B" stroke-width="1"/>
      <text x="235" y="335" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94A3B8">
        Construido con Laravel 11, Filament v3, PHP 8.2+ y una
      </text>
      <text x="235" y="352" text-anchor="middle" font-family="system-ui" font-size="12" fill="#38BDF8" font-weight="700">
        arquitectura de base de datos MySQL/MariaDB.
      </text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN ================= -->
  <!-- Roles y Acceso al Sistema -->
  <g transform="translate(1050, 130)">
    <text x="0" y="25" font-family="system-ui" font-size="24" font-weight="900" fill="#FFFFFF">Roles y Acceso al Sistema</text>
    <text x="0" y="50" font-family="system-ui" font-size="14" fill="#94A3B8">Seguridad perimetral y gobernanza de información</text>

    <!-- Role 1: Super Admin -->
    <g transform="translate(0, 70)">
      <rect width="810" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="22" fill="#78350F"/>
      <text x="45" y="51" text-anchor="middle" font-size="18">🔑</text>
      <text x="80" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#F59E0B">Super Administrador</text>
      <text x="80" y="60" font-family="system-ui" font-size="13" fill="#94A3B8">
        Posee control total sobre el sistema, gestión de usuarios, roles, sedes y configuraciones globales.
      </text>
    </g>

    <!-- Role 2: Jefe de Área -->
    <g transform="translate(0, 175)">
      <rect width="810" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="22" fill="#1E3A8A"/>
      <text x="45" y="51" text-anchor="middle" font-size="18">👔</text>
      <text x="80" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#38BDF8">Jefe de Área</text>
      <text x="80" y="60" font-family="system-ui" font-size="13" fill="#94A3B8">
        Supervisa y gestiona exclusivamente a los docentes adscritos a su sede y área académica específica.
      </text>
    </g>

    <!-- Role 3: Docente Académico -->
    <g transform="translate(0, 280)">
      <rect width="810" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="22" fill="#065F46"/>
      <text x="45" y="51" text-anchor="middle" font-size="18">🎓</text>
      <text x="80" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#10B981">Docente Académico</text>
      <text x="80" y="60" font-family="system-ui" font-size="13" fill="#94A3B8">
        Acceso personal para consultar su propio escalafón, carga horaria, permisos y descargar constancias individuales.
      </text>
    </g>

    <!-- Interoperabilidad y Fiabilidad Section -->
    <g transform="translate(0, 395)">
      <text x="0" y="25" font-family="system-ui" font-size="22" font-weight="900" fill="#FFFFFF">Interoperabilidad y Fiabilidad</text>

      <g transform="translate(0, 45)">
        <!-- Grid of 4 Cards -->
        <!-- Card A: API RESTful -->
        <g transform="translate(0, 0)">
          <rect width="395" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="20" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#38BDF8">API RESTful Documentada</text>
          <text x="20" y="65" font-family="system-ui" font-size="12.5" fill="#94A3B8">
            <tspan x="20" dy="0">Integración fluida con sistemas de</tspan>
            <tspan x="20" dy="18">nómina y control de estudios mediante</tspan>
            <tspan x="20" dy="18">estándares OpenAPI 3.0 y Swagger.</tspan>
          </text>
        </g>

        <!-- Card B: 100% de Pruebas Exitosas -->
        <g transform="translate(415, 0)">
          <rect width="395" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="20" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#10B981">100% de Pruebas Exitosas</text>
          <text x="20" y="65" font-family="system-ui" font-size="12.5" fill="#94A3B8">
            <tspan x="20" dy="0">El sistema cuenta con 49 pruebas</tspan>
            <tspan x="20" dy="18">automatizadas y 372 aserciones que</tspan>
            <tspan x="20" dy="18">garantizan la integridad total.</tspan>
          </text>
        </g>

        <!-- Card C: Multi-Tenant -->
        <g transform="translate(0, 165)">
          <rect width="395" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="20" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#60A5FA">Seguridad Multi-Inquilino</text>
          <text x="20" y="65" font-family="system-ui" font-size="12.5" fill="#94A3B8">
            <tspan x="20" dy="0">Aislamiento de datos por sede; los Jefes</tspan>
            <tspan x="20" dy="18">de Área solo visualizan registros vinculados</tspan>
            <tspan x="20" dy="18">a su jurisdicción académica.</tspan>
          </text>
        </g>

        <!-- Card D: Licencia MIT -->
        <g transform="translate(415, 165)">
          <rect width="395" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
          <text x="20" y="36" font-family="system-ui" font-size="16" font-weight="800" fill="#34D399">Licencia MIT (Código Abierto)</text>
          <text x="20" y="65" font-family="system-ui" font-size="12.5" fill="#94A3B8">
            <tspan x="20" dy="0">Proyecto liberado para la comunidad,</tspan>
            <tspan x="20" dy="18">permitiendo su replicación y adaptación</tspan>
            <tspan x="20" dy="18">en otras instituciones universitarias.</tspan>
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <line x1="60" y1="1040" x2="1860" y2="1040" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="1065" font-family="system-ui" font-size="14" font-weight="600" fill="#64748B">
    Universidad Nacional Experimental de los Llanos Centrales Rómulo Gallegos (UNERG) &bull; Autoría: Frank Sousa &bull; Licencia MIT
  </text>
  <text x="1860" y="1065" text-anchor="end" font-family="system-ui" font-size="14" font-weight="600" fill="#64748B">
    Gemini Notebook
  </text>
</svg>